name: PHP Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show PHP version
        run: php -v

      - name: Lint module PHP
        shell: bash
        run: |
          set -euo pipefail
          find magic_login -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate update manifest
        run: python3 -m json.tool magic_login/update_manifest.json >/dev/null
